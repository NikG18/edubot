name: Audit hardening checks

on:
  push:
    branches:
      - fix/audit-hardening-2026-09-03
  pull_request:

jobs:
  compile-and-pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Compile every Python source file
        run: |
          python - <<'PY'
          import pathlib, py_compile
          failed = []
          for path in pathlib.Path('.').rglob('*.py'):
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failed.append((str(path), repr(exc)))
          if failed:
              for path, exc in failed:
                  print(f'{path}: {exc}')
              raise SystemExit(1)
          print('All Python files compile successfully')
          PY
      - name: Run pure regression tests
        run: |
          python -m unittest -v \
            tests.test_pricing \
            tests.test_student_identity \
            tests.test_financial_rules \
            tests.test_subscription_allocation \
            tests.test_booking_visibility_rules \
            tests.test_callback_hardening \
            tests.test_runtime_patch_contracts
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke import hardened entrypoints
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          ADMING_ID: '1'
          ADMIN_VK_ID: '1'
          BOT_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi'
          VK_BOT_TOKEN: 'vk1.a.test_token_for_import_only'
          TINKOFF_TERMINAL_KEY: 'test-terminal'
          TINKOFF_SECRET_KEY: 'test-secret'
          TINKOFF_WEBHOOK_URL: ''
          FISCAL_OPERATOR_INN: '390612116215'
          FISCAL_OPERATOR_NAME: 'ИП Тест'
          FISCAL_OPERATOR_PHONE: '+79990000000'
        run: |
          python -c "import Bot_test_legal; print('Telegram hardened entrypoint import OK')"
          python -c "import vk_bot_legal; print('VK hardened entrypoint import OK')"
      - name: Verify runtime patch bindings
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          ADMING_ID: '1'
          ADMIN_VK_ID: '1'
          BOT_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi'
          VK_BOT_TOKEN: 'vk1.a.test_token_for_import_only'
          TINKOFF_TERMINAL_KEY: 'test-terminal'
          TINKOFF_SECRET_KEY: 'test-secret'
          TINKOFF_WEBHOOK_URL: ''
          FISCAL_OPERATOR_INN: '390612116215'
          FISCAL_OPERATOR_NAME: 'ИП Тест'
          FISCAL_OPERATOR_PHONE: '+79990000000'
        run: |
          python - <<'PY'
          import Bot_test_legal as entry
          legacy = entry.app.legacy
          assert legacy._subscription_booking_tg_installed is True
          assert legacy._cross_platform_tutor_confirmation_tg is True
          assert legacy._telegram_contact_delivery_hardened is True
          assert legacy._telegram_messaging_identity_hardened is True
          assert legacy._admin_booking_pagination_installed is True
          assert legacy.tutor_confirm_booking.__code__.co_freevars == ()
          assert entry.app.admin_bookings_list.__code__.co_freevars == ()
          print('Telegram runtime bindings OK')
          PY
          python - <<'PY'
          import vk_bot_legal as entry
          import vk_payment_hardening as payment
          legacy = entry.app.legacy
          assert legacy._subscription_booking_vk_installed is True
          assert legacy._cross_platform_tutor_confirmation_vk is True
          assert legacy._vk_payment_hardening_installed is True
          assert legacy._vk_reply_authorization_installed is True
          assert legacy._vk_contact_delivery_hardened is True
          assert payment._runtime_legacy is legacy
          assert legacy.qr is payment._vk_payment_qr
          assert legacy.card is payment._vk_payment_deprecated_method
          assert legacy.sbp is payment._vk_payment_deprecated_method
          assert legacy.oplata.__code__.co_freevars == ()
          print('VK runtime bindings OK')
          PY
