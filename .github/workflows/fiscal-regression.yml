name: Fiscal regression checks

on:
  push:
    branches:
      - fix/audit-hardening-2026-09-03
  pull_request:

jobs:
  fiscal-and-refund-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PR4 fiscal and refund regressions
        env:
          DATABASE_URL: postgresql://unused
        run: |
          python -m unittest -v \
            tests.test_fiscal_receipts_payload \
            tests.test_refund_flow
